<script>
(function(){
  const svg = document.getElementById('surveyMap');
  const replayBtn = document.getElementById('replayAnimation');
  const estado = document.getElementById('estadoAnimacion');

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const viewWidth = 1000;
  const viewHeight = 700;
  const margin = 55;

  const CONFIG = {
    lagoGeojson: 'LagoAtitlan.geojson',

    principales: {
      cantidad: 270,
      separacionMetros: 100,
      orientacionIda: 140,
      orientacionRetorno: 320,
      color: '#ff5252',
      grosor: 1.45,
      opacidad: 0.9,
      duracionPorLinea: 35
    },

    secundarias: {
      cantidad: 13,
      separacionMetros: 1000,
      orientacionIda: 247,
      orientacionRetorno: 67,
      color: '#f9d65c',
      grosor: 2.1,
      opacidad: 0.95,
      duracionPorLinea: 280
    }
  };

  let animationRunning = false;
  let currentTimers = [];

  function setStatus(msg){
    if(estado) estado.textContent = msg;
  }

  function clearTimers(){
    currentTimers.forEach(t => cancelAnimationFrame(t));
    currentTimers = [];
  }

  function createSvgEl(tag, attrs = {}){
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
  }

  function extractRings(geojson){
    const features = geojson.type === 'FeatureCollection' ? geojson.features : [geojson];
    const rings = [];

    features.forEach(feature => {
      const geom = feature.type === 'Feature' ? feature.geometry : feature;
      if(!geom) return;

      if(geom.type === 'Polygon'){
        geom.coordinates.forEach(ring => rings.push(ring));
      }

      if(geom.type === 'MultiPolygon'){
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => rings.push(ring));
        });
      }
    });

    return rings.filter(ring => Array.isArray(ring) && ring.length > 3);
  }

  function geoToProjected(rings){
    const allPoints = rings.flat();

    const lat0 = allPoints.reduce((acc, coord) => acc + coord[1], 0) / allPoints.length;
    const lon0 = allPoints.reduce((acc, coord) => acc + coord[0], 0) / allPoints.length;

    const R = 6378137;
    const cosLat = Math.cos(lat0 * Math.PI / 180);

    function project(coord){
      const lon = coord[0];
      const lat = coord[1];

      const x = (lon - lon0) * Math.PI / 180 * R * cosLat;
      const y = (lat - lat0) * Math.PI / 180 * R;

      return { x, y, lon, lat };
    }

    return rings.map(ring => ring.map(project));
  }

  function computeBounds(projectedRings){
    const pts = projectedRings.flat();

    return pts.reduce((bounds, pt) => {
      return {
        minX: Math.min(bounds.minX, pt.x),
        minY: Math.min(bounds.minY, pt.y),
        maxX: Math.max(bounds.maxX, pt.x),
        maxY: Math.max(bounds.maxY, pt.y)
      };
    }, {
      minX: Infinity,
      minY: Infinity,
      maxX: -Infinity,
      maxY: -Infinity
    });
  }

  function buildTransform(bounds){
    const width = bounds.maxX - bounds.minX || 1;
    const height = bounds.maxY - bounds.minY || 1;

    const scale = Math.min(
      (viewWidth - margin * 2) / width,
      (viewHeight - margin * 2) / height
    );

    return function transform(pt){
      return {
        x: margin + (pt.x - bounds.minX) * scale,
        y: viewHeight - margin - (pt.y - bounds.minY) * scale
      };
    };
  }

  function ringToPath(ring, transform){
    return ring.map((pt, idx) => {
      const p = transform(pt);
      return `${idx === 0 ? 'M' : 'L'}${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
    }).join(' ') + ' Z';
  }

  function getCenter(bounds){
    return {
      x: (bounds.minX + bounds.maxX) / 2,
      y: (bounds.minY + bounds.maxY) / 2
    };
  }

  function getDiagonal(bounds){
    return Math.hypot(
      bounds.maxX - bounds.minX,
      bounds.maxY - bounds.minY
    );
  }

  function generateSurveyLines({
    bounds,
    transform,
    cantidad,
    separacionMetros,
    orientacionIda,
    orientacionRetorno,
    color,
    grosor,
    opacidad
  }){
    const thetaIda = orientacionIda * Math.PI / 180;
    const thetaRetorno = orientacionRetorno * Math.PI / 180;

    const dirIda = {
      x: Math.sin(thetaIda),
      y: Math.cos(thetaIda)
    };

    const dirRetorno = {
      x: Math.sin(thetaRetorno),
      y: Math.cos(thetaRetorno)
    };

    const normal = {
      x: -dirIda.y,
      y: dirIda.x
    };

    const center = getCenter(bounds);
    const diag = getDiagonal(bounds) * 2.4;
    const centerOffset = center.x * normal.x + center.y * normal.y;

    const lines = [];

    for(let i = 0; i < cantidad; i++){
      const centeredIndex = i - (cantidad - 1) / 2;
      const offset = centerOffset + centeredIndex * separacionMetros;

      const pointOnLine = {
        x: center.x + normal.x * (offset - centerOffset),
        y: center.y + normal.y * (offset - centerOffset)
      };

      const dir = i % 2 === 0 ? dirIda : dirRetorno;

      const a = {
        x: pointOnLine.x - dir.x * diag,
        y: pointOnLine.y - dir.y * diag
      };

      const b = {
        x: pointOnLine.x + dir.x * diag,
        y: pointOnLine.y + dir.y * diag
      };

      const p1 = transform(a);
      const p2 = transform(b);

      const line = createSvgEl('line', {
        x1: p1.x.toFixed(2),
        y1: p1.y.toFixed(2),
        x2: p2.x.toFixed(2),
        y2: p2.y.toFixed(2),
        stroke: color,
        'stroke-width': grosor,
        'stroke-linecap': 'round',
        opacity: opacidad,
        'vector-effect': 'non-scaling-stroke'
      });

      lines.push(line);
    }

    return lines;
  }

  function resetLine(line){
    const length = line.getTotalLength();

    line.style.strokeDasharray = String(length);
    line.style.strokeDashoffset = String(length);
    line.style.visibility = 'visible';

    return length;
  }

  function prepareAnimation(lines){
    lines.forEach(line => {
      const length = resetLine(line);
      line.style.strokeDashoffset = String(length);
    });
  }

  function animateLine(line, duration){
    return new Promise(resolve => {
      const length = resetLine(line);
      const start = performance.now();

      function step(now){
        const progress = Math.min((now - start) / duration, 1);
        line.style.strokeDashoffset = String(length * (1 - progress));

        if(progress < 1){
          const raf = requestAnimationFrame(step);
          currentTimers.push(raf);
        } else {
          line.style.strokeDashoffset = '0';
          resolve();
        }
      }

      const raf = requestAnimationFrame(step);
      currentTimers.push(raf);
    });
  }

  async function runSequence(primaryLines, secondaryLines){
    if(animationRunning) return;

    animationRunning = true;

    setStatus('Animando líneas principales: 270 transectos a 100 m…');
    for(const line of primaryLines){
      await animateLine(line, CONFIG.principales.duracionPorLinea);
    }

    setStatus('Animando líneas secundarias: 13 transectos a 1,000 m…');
    for(const line of secondaryLines){
      await animateLine(line, CONFIG.secundarias.duracionPorLinea);
    }

    setStatus('Recorrido reconstruido según la metodología del paper.');
    animationRunning = false;
  }

  async function init(){
    try{
      if(!svg){
        console.error('No existe el elemento SVG con id="surveyMap".');
        return;
      }

      setStatus('Cargando geometría del lago…');

      const response = await fetch(CONFIG.lagoGeojson);

      if(!response.ok){
        throw new Error('No se pudo cargar LagoAtitlan.geojson');
      }

      const geojson = await response.json();
      const rings = extractRings(geojson);

      if(!rings.length){
        throw new Error('El GeoJSON no contiene polígonos válidos.');
      }

      const projectedRings = geoToProjected(rings);
      const bounds = computeBounds(projectedRings);
      const transform = buildTransform(bounds);

      svg.innerHTML = '';

      const defs = createSvgEl('defs');
      const clipPath = createSvgEl('clipPath', { id: 'lakeClip' });

      const lakeGroup = createSvgEl('g', { id: 'lakeLayer' });
      const surveyGroup = createSvgEl('g', {
        id: 'surveyLayer',
        'clip-path': 'url(#lakeClip)'
      });

      projectedRings.forEach((ring, idx) => {
        const pathData = ringToPath(ring, transform);

        const clipNode = createSvgEl('path', {
          d: pathData
        });

        clipPath.appendChild(clipNode);

        const lakePath = createSvgEl('path', {
          d: pathData,
          fill: '#4fa3dd',
          'fill-opacity': '0.78',
          stroke: '#d8eefb',
          'stroke-width': idx === 0 ? '2.1' : '1.2',
          'vector-effect': 'non-scaling-stroke'
        });

        lakeGroup.appendChild(lakePath);
      });

      defs.appendChild(clipPath);
      svg.appendChild(defs);
      svg.appendChild(lakeGroup);
      svg.appendChild(surveyGroup);

      const primaryLines = generateSurveyLines({
        bounds,
        transform,
        cantidad: CONFIG.principales.cantidad,
        separacionMetros: CONFIG.principales.separacionMetros,
        orientacionIda: CONFIG.principales.orientacionIda,
        orientacionRetorno: CONFIG.principales.orientacionRetorno,
        color: CONFIG.principales.color,
        grosor: CONFIG.principales.grosor,
        opacidad: CONFIG.principales.opacidad
      });

      const secondaryLines = generateSurveyLines({
        bounds,
        transform,
        cantidad: CONFIG.secundarias.cantidad,
        separacionMetros: CONFIG.secundarias.separacionMetros,
        orientacionIda: CONFIG.secundarias.orientacionIda,
        orientacionRetorno: CONFIG.secundarias.orientacionRetorno,
        color: CONFIG.secundarias.color,
        grosor: CONFIG.secundarias.grosor,
        opacidad: CONFIG.secundarias.opacidad
      });

      primaryLines.forEach(line => surveyGroup.appendChild(line));
      secondaryLines.forEach(line => surveyGroup.appendChild(line));

      prepareAnimation([...primaryLines, ...secondaryLines]);

      setStatus('Listo para reproducir.');

      if(replayBtn){
        replayBtn.addEventListener('click', () => {
          if(animationRunning) return;

          clearTimers();
          prepareAnimation([...primaryLines, ...secondaryLines]);
          runSequence(primaryLines, secondaryLines);
        });
      }

      runSequence(primaryLines, secondaryLines);

    } catch(error){
      console.error(error);
      setStatus('No fue posible cargar la animación. Verifica que LagoAtitlan.geojson esté en la carpeta docs/.');
    }
  }

  init();
})();
</script>
